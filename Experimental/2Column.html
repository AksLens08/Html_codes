<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<style>
/* Apply border-box globally so padding doesn't break column widths */

*{
box-sizing: border-box;
}
/* Style the columns */
.column {
  float: left;
  width: 50%; /* Creates 3 equal columns */
  padding: 15px; /* Adds spacing inside columns */
}
</style>
</head>
<body>

<div class="row">
  <div class="column">
    <h2>Column 1</h2>
    <p>Left side content goes here.</p>
  </div>
  <div class="column">
    <h2>Column 2</h2>
    <p>Middle main content goes here.</p>
  </div>
</div>


</body>
</html>
