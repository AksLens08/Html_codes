!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Table</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  
  table {
    width: 50%;
    border-collapse: collapse;
  }

  th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }

  tr:hover {background-color: #f5f5f5;}
</style>
</head>
<body>

<table>
  <tr>
    <th>Header 1</th>
    <th>Header 2</th>
  </tr>
  <tr>
    <td>Data 1</td>
    <td>Data 2</td>
  </tr>
  <tr>
    <td>Data 3</td>
    <td>Data 4</td>
  </tr>
</table>

</body>
</html>
