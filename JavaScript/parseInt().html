<!DOCTYPE html>
<html>
    <head>
        <title>ParseInt() Function Example</title>
    </head>
    <body>
        <script type="text/javascript">
            function myFunction(){
                var a=parseInt("10.50");
                var b=parseInt("10.00");
                var c=parseFloat("10.33");
                var n=a+"\n"+b+"\n"+c;
                alert("Result is\n"+n);
            }
        </script>
        <form name="myForm">
        <input type="submit" value="Result" onClick="myFunction()">
        </form>
    </body>
</html>
