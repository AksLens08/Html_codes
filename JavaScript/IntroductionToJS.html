<!DOCTYPE html>
<html>
    <head>
        <title>Introduction to JavaScript</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Introduction to JavaScript</h1>
        <p>
            Javascript is used mainly for enchancing the interaction of a user with the webpage.<br>
            Javascript can be inserted within the head, the body,<br>
            or use external Javascript file saved as (.js).
        </p>
        <div id="text">
        </div>
        <script type="text/javascript">
            document.getElementById('text').innerHTML=20+30;
        </script>
        <h2>This is Testing</h2>
    </body>
</html>
