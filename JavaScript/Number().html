<!DOCTYPE html>
<html>
    <head>
        <title>Number() Function Example</title>
    </head>
    <body>
        <script type="text/javascript">
            function myFunction(){
                var x1=true;
                var x2=false;
                var x3="999";
                var x4="999 888";
                var x5="Hello";
                var n=x1 + ":"+Number(x1)+"\n"+x2+":"+Number(x2)+"\n"+x3+":"+Number(x3)+"\n"+x4+":"+Number(x4)+"\n"+x5+":"+Number(x5);
                alert("Result is " +n);
            }
        </script>
        <form name="myForm">
        <input type="submit" value="Show Result" onClick="myFunction()">
        </form>
    </body>
</html>
