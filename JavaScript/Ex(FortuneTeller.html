<!DOCTYPE html>
<html>
<head>
    <title>The Fortune Teller</title>
</head>
<body>

<script type="text/javascript">
    var x = prompt("Enter job title:");
    var y = prompt("Enter geographic location:");
    var z = prompt("Enter partner's name:");
    var n = prompt("Enter number of children:");

    var result = "You will be a " + x + " in " + y + ", and married to " + z + " with " + n + " kids.";

    window.alert(result);

    document.write(result);
</script>
