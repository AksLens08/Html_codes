<!DOCTYPE html>
<html lang="en">
    <head>
        <title>String() Function Example</title>
    </head>
    <body>
        <script type="text/javascript">
            function myFunction(){
                var x1=Boolean(0);
                var x2=Boolean(1);
                var res=String(x1)+ "\n"+String(x2);
                alert("Result is\n"+res);
            }
        </script>
        <form name="myForm">
        <input type="submit" value="Result" onClick="myFunction()">
        </form>
    </body>
</html>
