<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ParseFloat() Function Example</title>
    </head>
    <body>
        <script type="text/javascript">
            function myFunction(){
                var a=parseFloat("10.50")
                var b=parseFloat("10.00")
                var c=parseFloat("10.33")
                alert("Result is\n" +a+"\n"+b+"\n"+c);
            }
        </script>
        <form name="myForm">
        <input type="submit" value="Result" onClick="myFunction()">
        </form>
    </body>
</html>
