<!DOCTYPE html>
<html>
<head>
    <title>Exercise 2</title>
    <script type="text/javascript">
        var books = [
            { title: "Professional", author: "Jue", alreadyRead: false },
            { title: "The Password of My Heart", author: "Loon Htar Htar", alreadyRead: true }
        ];

        for (var i = 0; i < books.length; i++) {
            console.log(books[i].title + " by " + books[i].author);
            if (books[i].alreadyRead) {
                console.log("You already read \"" + books[i].title + "\" by " + books[i].author);
            } else {
                console.log("You still need to read \"" + books[i].title + "\" by " + books[i].author);
            }
        }

        var output = "";
        for (var i = 0; i < books.length; i++) {
            if (books[i].alreadyRead) {
                output += "You already read \"" + books[i].title + "\" by " + books[i].author + "<br>";
            } else {
                output += "You still need to read \"" + books[i].title + "\" by " + books[i].author + "<br>";
            }
        }

        document.write(output);
    </script>
</head>
<body>
</body>
</html>
