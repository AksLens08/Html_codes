<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Exercise</title>
</head>

<body>

    <script>
        var choices = ['red', 'orange', 'pink', 'yellow'];

        for (var i = 0; i < choices.length; i++) {
            console.log("My #" + (i + 1) + " choice is " + choices[i]);
        }

        for (var i = 0; i < choices.length; i++) {
            var num = i + 1;
            var suffix;
            if (num === 1) {
                suffix = "st";
            } else if (num === 2) {
                suffix = "nd";
            } else if (num === 3) {
                suffix = "rd";
            } else {
                suffix = "th";
            }
            console.log("My " + num + suffix + " choice is " + choices[i]);
        }
    </script>

</body>

</html>
