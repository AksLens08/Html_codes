<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Name Array Exercise</title>
</head>

<body>

    <h2>Staff Name Array Exercise</h2>

    <script>
        let staffName = ['U Aung', 'Daw Hla', 'U Tun'];

        staffName.push('Daw Sandar', 'U Kyaw Kyaw');

        staffName.unshift('U Nay Myo');

        let removedPerson = staffName.shift();

        document.write("<h3>staffName Array:</h3>");
        document.write("<p>" + staffName + "</p>");
        
        document.write("<h3>removedPerson:</h3>");
        document.write("<p>" + removedPerson + "</p>");
    </script>

</body>

</html>
