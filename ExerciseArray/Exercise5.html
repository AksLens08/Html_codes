<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Array Exercise</title>
</head>

<body>

    <script>
        function sum_square(arr) {
            return arr.reduce(function(acc, val) {
                return acc + val * val;
            }, 0);
        }

        var array = [1, 2, 3, 4, 5];
        alert("The sum of the squares of array is  " + sum_square(array));
    </script>

</body>

</html>
