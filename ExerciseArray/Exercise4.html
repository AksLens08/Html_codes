<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>JavaScript Array Exercise</title>
</head>

<body>

    <script>
        var arrayInt = [1, 2, 3, 4, 5, 6];

        var sum = arrayInt.reduce(function(acc, val) {
            return acc + val;
        }, 0);

        var product = arrayInt.reduce(function(acc, val) {
            return acc * val;
        }, 1);

        document.write("<p>Sum of all elements in array= " + sum + "</p>");
        document.write("<p>Product of all elements in array= " + product + "</p>");
    </script>

</body>

</html>
