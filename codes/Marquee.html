<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Marquee</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <marquee direction="right">Left to Right</marquee><br><br>
        <marquee direction="up" height="70">Going up</marquee><br><br>
        <marquee bgcolor="aqua" height="60" direction="right"><Font size="7">This text is moving 
            from left to right</Font></marquee><br><br>
        <marquee direction="down" width="250" height="100" bgcolor="navyblue" style="border:solid blue" behavior="alternate">
        <marquee vspace=20 behavior="alternate">Bounce</marquee>
        </marquee><br><br>
        <marquee scrollamount="20" loop="3" behavior="alternate">Scrolling text</marquee> 
        </marquee><br><br>
        <marquee hspace=0 scrollamount="20"><img src="A380.jpg" alt="A380"></marquee>
        <marquee hspace=0 scrollamount="20"><img src="B747.jpg" alt="B747"></marquee>
    </body>
</html>
