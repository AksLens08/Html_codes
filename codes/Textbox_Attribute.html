<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form Example</title>
        <meta charset="utf-8">
    </head>
    <body>
        <form name="order" id="order" method="get" action="backgroundColor1.html">
            Name:<input type="text" name="name" id="name" required="required"><br><br>
            City:<input type="text" name="City" maxlength="10" size="15" value="City"><br><br>
            Age:<input type="text" name="Age" disabled="disabled"><br><br>
            Job:<input type="text" name="Job" value="programmer" readonly="readonly"><br><br>
            NRC:<input type="text" name="NRC" autofocus="autofocus"><br><br>
            State:<input type="text" name="State" tabindex="1" accesskey="S">
            <input type="text" size="11" placeholder="Accesskey S"><br><br>
            No:<input type="text" name="no" tabindex="2" accesskey="N">
            <input type="text" size="11" placeholder="Accesskey N"><br><br>
            <input type="submit" name="submit">&nbsp;&nbsp;&nbsp;<input type="reset" 
            name="reset" value="Clear">
        </form>
    </body>
</html>
