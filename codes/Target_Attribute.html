<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Example</title>
    <meta charset="utf-8">
</head>
<body>

    <form name="sale" id="sale" method="post" action="backgroundColor1.html" target="_blank" autocomplete="on">
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="fname"><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" name="lname" id="lname"><br><br>

        <input type="submit" name="btnsubmit" value="Send">
    </form>
    <br><br>

    <iframe name="showFrame" width="300" height="200"></iframe>

    <form action="passwordTextbox.html" name="order" id="order" target="showFrame">
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="fname"><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" name="lname" id="lname"><br><br>

        <input type="submit" name="btnsubmit" value="Send">
        <input type="reset">
    </form>

</body>
</html>
