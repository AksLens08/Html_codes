<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Controls</title>
    <meta charset="utf-8">
</head>
<body>

    <form>
        Search: <input type="search" name="search"><br><br>
        Telephone: <input type="tel" name="Telephone"><br><br>
        Date: <input type="Date" name="Date"><br><br>
        Time: <input type="Time" name="Time"><br><br>
        Date Time: <input type="datetime-local" name="dt_local"><br><br>
        Range: <input type="Range" name="Range"><br><br>
        Color: <input type="color" name="color"><br><br>
        Hidden: <input type="hidden" name="hidden" value="order@site.com"><br><br>
        Month: <input type="Month" name="Month"><br><br>
        Number: <input type="Number" name="Number" min="0" max="10"><br><br>
        File: <input type="file" name="file"><br><br>
        Text: <input type="text" name="text"><br><br>
        Week: <input type="week" name="week"><br><br>
        URL: <input type="URL" name="URL"><br><br>
        Image: <input type="image" name="Image" src="A380.jpg" width="150" height="7 0"><br><br>
        
        Button: <input type="Button" value="Okay" onclick="alert('OK')">
        <input type="submit" name="submit" value="Send">
    </form>

</body>
</html>
