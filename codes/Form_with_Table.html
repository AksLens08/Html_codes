<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
</head>
<body>

    <form name="order" id="order" method="get" action="backgroundColor1.html">
        <table>
            <tr>
                <td>Name:</td>
                <td>
                    <input type="text" name="name" id="name" required>
                </td>
            </tr>
            <tr>
                <td>City:</td>
                <td>
                    <input type="text" name="City" maxlength="10" size="15" value="City">
                </td>
            </tr>
            <tr>
                <td>Age:</td>
                <td>
                    <input type="text" name="Age" disabled>
                </td>
            </tr>
            <tr>
                <td>Job:</td>
                <td>
                    <input type="text" name="Job" value="Programmer" readonly="readonly">
                </td>
            </tr>
            <tr>
                <td>NRC:</td>
                <td>
                    <input type="text" name="NRC" autofocus>
                </td>
            </tr>
            <tr>
                <td>State:</td>
                <td>
                    <input type="text" name="State" tabindex="1" accesskey="S">
                    <input type="text" size="11" placeholder="Accesskey S">
                </td>
            </tr>
            <tr>
                <td>No:</td>
                <td>
                    <input type="text" name="no" tabindex="2" accesskey="N">
                    <input type="text" size="11" placeholder="Accesskey N">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" name="submit" value="Submit">
                </td>
                <td>
                    <input type="reset" name="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
