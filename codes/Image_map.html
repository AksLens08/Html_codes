<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image Map</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <img src="rose.jpg" usemap="#myRose" title="The Rose Plant">
        <map id="myRose" name="myRose">
            <area href="https://lms.miit.edu.mm" shape="circle" coords="545,245,110" title="Bloom">
            <area href="https://google.com" shape="rect" coords="190,830,480,980" title="The Rose Leaves">
            <area href="leaves.jpg" shape="poly" coords="34,618,118,607,180,637,197,682,184,729,88,712,57,681" title="Leaf">
        </map>
    </body>
</html>
