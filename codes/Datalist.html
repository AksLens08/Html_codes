<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Datalist</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <form>
            <label>Favourite Browser</label>
            <input list="browsers">
            <datalist id="browsers">
                <option value="Micsrosoft Edge">
                <option value="Firefox">
                <option value="Chrome">
                <option value="Safari">
                <option value="Opera">
            </datalist>
        </form>
    </body>
</html>
