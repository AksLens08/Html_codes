<!DOCTYPE html>
<html lang="en">
<head>
    <title>Aircraft Information Table</title>
    <meta charset="utf-8">
</head>
<body bgcolor="white">
    <br><br>
    <table bgcolor="lightgrey" align="center" border="1" cellspacing="0" cellpadding="0" width="850">
        <tr bgcolor="lightgrey" height="60">
            <th colspan="5">Aircraft Information</th>
        </tr>
        <tr bgcolor="silver" height="50">
            <th width="180">Category</th>
            <th width="90">Sr.</th>
            <th width="140">Model</th>
            <th width="250">Date of Issue</th>
            <th width="190">Photo</th>
        </tr>
        <tr bgcolor="white" height="150" align="center">
            <td rowspan="3" bgcolor="grey"><b>Aircraft at<br>Yangon<br>International<br>Airport</b></td>
            <td>1</td>
            <td>Airbus A320</td>
            <td>September 5, 2019<br>(MAI)</td>
            <td><img src="AirbusA320.png" alt="Airbus A320" width="140" height="95"></td>
        </tr>
        <tr bgcolor="white" height="150" align="center">
            <td>2</td>
            <td>Embraer E190</td>
            <td>December 21, 2020<br>(MAI)</td>
            <td><img src="EmbraerE190.png" alt="Embraer E190" width="125" height="85"></td>
        </tr>
        <tr bgcolor="white" height="150" align="center">
            <td>3</td>
            <td>Airbus A330</td>
            <td>First Introduced<br>(China Airlines)</td>
            <td><img src="AirbusA330.png" alt="Airbus A330" width="150" height="100"></td>
        </tr>
    </table>
</body>
</html>
