<!DOCTYPE html>
<html>
    <head>
        <title>Javascript Date</title>
        <script type="text/javascript">
            var today = new Date();
            var d = today.getDate();
            var m = today.getMonth() + 1;
            var y = today.getFullYear(); 
            document.write("<br>Date is " + d + "/" + m + "/" + y); 
        </script>
    </head>
</html>
