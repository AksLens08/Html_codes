<!DOCTYPE html>
<html lang="en">
<head>
    <title> Displaying max and min </title>
</head>
<body>
    <script>
        var max = Math.max(3, 54, 32, 16);
        alert("Maximum number is " +max);
        var min = Math.min(3, 54, 32, 16);
        alert("Minimum number is " +min);
    </script>
</body>
</html>
