<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Displaying current time</title>
    </head>
    <body>
        <script>
            var today=new Date();
            var h=today.getHours();
            var m=today.getMinutes()+1;
            var s=today.getSeconds();
           alert(h+":"+m+":"+s);
        </script>
    </body>
</html>
