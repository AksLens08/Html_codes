<!DOCTYPE html>
<html>
<head>
    <title>Math Functions</title>
</head>
<body>
    <script>
        var power = Math.pow(5, 2);
        var a = Math.sqrt(16);
        var b = Math.pow(4, 3);
        document.write("Power of 5 is "+power+"<br>");
        document.write(" Square root of 16 is "+a+"<br>");
        document.write(" 4 Power of 3 is "+b+"<br>");
        var num1 = 38.8;
        var roundedNumber = Math.floor(num1);
        var roundedNumber2 = Math.round(num1);
        var roundedNumber3 = Math.ceil(num1);
        document.write(" Floor method of num1 is "+roundedNumber+"<br>");
        document.write(" Round method of num1 is "+roundedNumber2+"<br>");
        document.write(" Ceil method of num1 is "+roundedNumber3+"<br>");
        document.write(Math.floor((Math.random() * 10) + 1));
    </script>
</body>
</html>
