<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript code</title>
        <script type="text/javascript">
            let arr=['orange', 'apple'];
            arr.push('watermelon', 'papaya');
            let arr2=arr;
            document.write("Original array is " +arr+ "<br>");
            document.write("Copied array is " +arr2+ "<br>");
            arr2.pop(); 
            document.write("After pop, array is " +arr2+ "<br>");
            arr2.shift();
            document.write("After shift, array is " +arr2+ "<br>");
            arr2.unshift('banana','pineapple');
            document.write("After unshift, array is " +arr2+ "<br>");
            arr2.push('grapes');
            document.write("After push, array is " +arr2+ "<br>");
        </script>
    </head>
    <body>
    </body>
</html>
