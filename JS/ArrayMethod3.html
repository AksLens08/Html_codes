<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Array Example!!!</title>
    <script type="text/javascript">
        var color = ['red', 'blue', 'green', 'orange', 'pink', 'black'];
        var color2 = color.slice(1);
        document.write(color2 + "<br><br>");
        var color3 = color.slice(3);
        document.write(color3 + "<br><br>");
        var color4 = color.slice(1, 4);
        document.write(color4 + "<br><br>");
        var color5 = color.slice(2, 5);
        document.write(color5 + "<br><br>");
        document.write(color + "<br><br>");
    </script>
</head>

<body>
</body>

</html>
