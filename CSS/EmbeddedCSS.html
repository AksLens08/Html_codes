<!DOCTYPE html>
<html>
    <head>
        <title>Embedded CSS (or) Internal CSS</title>
        <meta charset="utf-8">
        <style>
            body {background-color:pink; color:orange; }
            h1 {background-color:white; color:brown; }
            p {background-color:silver; color:gold; }
        </style>
    </head>
    <body>
        <h1>Embedded CSS</h1>
        <p>This paragraph uses embedded styles.</p>
        <h2>MIIT</h2>
        <h1>Welcome</h1>
    </body>
</html>
