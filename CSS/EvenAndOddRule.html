<!DOCTYPE html>
<html>
    <head>
        <title>Even and Odd Rules</title> 
        <meta charset="utf-8">
        <style type="text/css">
            h1{text-align: center;}
            .table 
            {
                width: 500px;
            }
            td
            {
                border: 1pxsolid black;
            }
            tr:nth-child(even)
            {
                background-color: magenta;
            }
            tr:nth-child(odd)
            {
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <h1>Time Table</h1>
        <table class="table" align="center">
            <tr>
                <td>
                    <b>Monday</b>
                </td>
                <td>
                    <b>Tuesday</b>
                </td>
                <td>
                    <b>Wednesday</b>
                </td>
            </tr>
        </table>
    </body>
</html>
