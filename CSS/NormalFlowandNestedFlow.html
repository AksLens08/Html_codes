<!DOCTYPE html>
<html>
    <head>
        <title>Normal flow</title>
        <style type="text/css">
            .div1 {
                background-color: lightblue;
                width: 200px;
                height: 200px;
                padding: 5px;
                border: 2px dashed green;
            }
            .div2 {
                background-color: gray;
                width: 100px;
                height: 100px;
                padding: 5px;
                border: 2px dashed green;
            }
        </style>
    </head>
    <body>
        <div class="div1">This is the first box.</div>
        <div class="div2">This is the second box.</div>
    </body>
</html>
