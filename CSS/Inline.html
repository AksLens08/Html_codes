<!DOCTYPE html>
<html>
    <head>
        <title>Inline CSS</title>
        <meta charset="utf-8">
    </head>
    <body style="background-color:brown;color:white">
        <h1 style="background-color:white;color:brown">Inline CSS</h1>
        <p>This paragraph inherits the style applied to the body tag.</p>
        <p style="color:orange">
            This paragraph overrides the text color style applied to the body tag.
        </p>
    </body>
</html>
