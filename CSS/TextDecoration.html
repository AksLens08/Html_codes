<!DOCTYPE html>
<html>
    <head>
        <title>Text Decoration with CSS</title>
        <meta charset="utf-8">
        <style text="text/css">
            h1
            {
                text-decoration:underline overline;
                text-decoration-color:aqua;
                text-decoration-style:dashed;
                text-decoration-thickness: 5pt;
            }
            p
            {
                text-decoration-thickness: 5px;
                text-decoration-line: underline;
                text-decoration-color:brown;
                text-decoration-style: dotted;
            }
            a{text-decoration:none;}
        </style>
    </head>
    <body>
        <h1>2025-MIIT_ECE_008</h1>
        <p> 
            All links in html are underlined by defult. Sometimes you see that link 
            are styled with no underline. The text-decoration: none; is used to remove the 
            underline from links
        </p>
        <a href="ID.html">No underline link</a>
    </body>
</html>
