<!DOCTYPE html>
<html>
    <head>
        <title>Embedded CSS</title>
        <meta charset="utf-8">
    </head>
    <body style="background-color:gold; color:red ">
        <h1 style="background-color: honeydew; color:blueviolet;">Inline CSS</h1>
        <p>This paragraph inherits the styles applied to the body tag.</p>
        <p style="color:silver;">
            This paragraph overrides the text color style applied to the body tag.
        </p>
    </body>
</html>
